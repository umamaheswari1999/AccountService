event-gateway:
  url: http://localhost:8800
spring:
  application:
    name: AccountService
  cloud:
    circuitbreaker:
      resilience4j:
        enableSemaphoreDefaultBulkhead: true
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    url: jdbc:h2:mem:accountservice;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
    hikari:
      pool-name: AccountServiceHikariPool
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
    jpa:
      database-platform: org.hibernate.dialect.H2Dialect
      hibernate:
        ddl-auto: update
      show-sql: false
    h2:
      console:
        enabled: true
        path: /h2-console
    timelimiter:
      instances:
        default:
          timeoutDuration: 3s
          cancelRunningFuture: true
    retry:
      instances:
        default:
          maxAttempts: 3
          waitDuration: 500ms
          enableExponentialBackoff: true
          exponentialBackoffMultiplier: 2
    ratelimiter:
      instances:
        default:
          limitForPeriod: 10
          limitRefreshPeriod: 1s
          timeoutDuration: 10000ms
          registerHealthIndicator: true
  management:
    endpoints:
      web:
        exposure:
          include: health,info,metrics,prometheus
    endpoint:
      health:
        show-details: always
        show-components: always
        probes:
          enabled: true
    info:
      env:
        enabled: true
      java:
        enabled: true
      os:
        enabled: true
    health:
      circuitbreakers:
        enabled: true
      ratelimiters:
        enabled: true
    metrics:
      tags:
        application: ${spring.application.name}
    prometheus:
      metrics:
        export:
          enabled: true
resilience4j:
  circuitbreaker:
    configs:
      default:
        registerHealthIndicator: true
        slidingWindowType: COUNT_BASED
        slidingWindowSize: 10
        minimumNumberOfCalls: 5
        permittedNumberOfCallsInHalfOpenState: 3
        automaticTransitionFromOpenToHalfOpenEnabled: true
        waitDurationInOpenState: 10s
        failureRateThreshold: 50
  bulkhead:
    configs:
      default:
        maxConcurrentCalls: 10
        maxWaitDuration: 0
